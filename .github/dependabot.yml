version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      minor-y-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Las librerías del navegador se sirven fijas desde public/vendor/.
      # Actualizarlas exige descargar la nueva versión y probar la app.
      - dependency-name: "@supabase/supabase-js"
        update-types:
          - "version-update:semver-major"
